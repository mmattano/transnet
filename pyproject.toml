[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "transnet"
version = "0.1.1"
description = "A package for trans-omics data integration and network analysis"
readme = "README.md"
authors = [
    {name = "Matthias Anagho-Mattanovich", email = "matthias.mattanovich@sund.ku.dk"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0,<2.0",  # Pin to 1.x for compatibility
    "pandas>=1.2.0",
    "networkx>=2.5",
    "matplotlib>=3.3.0",
    "scipy>=1.6.0",
    "scikit-learn>=0.24.0",
    "statsmodels>=0.12.0",
    "bioservices>=1.9.0",
    "mygene>=3.2.0",
    "requests>=2.25.0",
    "zeep>=4.0.0",
    "biopython>=1.78",
    "pyensembl>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "flake8>=3.8",
    "python-dotenv>=0.5.1",
]
viz = [
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]
docs = [
    "Sphinx>=4.3.2",
    "nbsphinx>=0.8.0",
]
all = [
    "transnet[dev,viz,docs]",
]

[project.urls]
Homepage = "https://github.com/mmattano/transnet"
Documentation = "https://github.com/mmattano/transnet"
Repository = "https://github.com/mmattano/transnet"
Issues = "https://github.com/mmattano/transnet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["transnet*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["transnet"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
