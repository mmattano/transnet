name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,notebooks]"

      - name: Lint (syntax errors and undefined names)
        run: flake8 transnet --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Unit tests (offline)
        run: pytest -m "not network and not slow"

      - name: Walkthroughs (offline)
        if: matrix.python-version == '3.11'
        run: pytest -m "slow and not network"
